<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Active On Fitness</title>
</head>
<body>
    <div class="encabezado">
        <img src="Recursos Proyecto Facu/logo.png" alt="logo">
        <div class="botones">
            <button id="qs">Quienes Somos</button>
            <a href="#productos"><button id="prod">Productos</button></a>
            <button id="not">Noticias</button>
            <a href="#contacto"><button id="cont">Contacto</button></a>
        </div>
    </div>
    
    <article class="presentacion">
          <img src="Recursos Proyecto Facu/banner.png" alt="banner">
    </article>
    
    <section id="productos" class="productos">
        <div class="productosDigitales">
        <div class="tituloProductos">
            <h3>Productos Digitales</h3>
        </div>
          <div class="producto">
             <img src="Recursos Proyecto Facu/abdominales.png" alt="Abdominales">
             <p>Rutinas para Abdominales</p>
          </div>
          <div class="producto">
             <img src="Recursos Proyecto Facu/nutricion.png" alt="Nutrición">
             <p>Plan de Nutrición</p>
          </div>
          <div class="producto">
             <img src="Recursos Proyecto Facu/running.png" alt="Running">
             <p>Entrenamiento Running</p>
          </div>
    </div>
      </section>
    
      <section class="registro">
        <form class="formulario">
            <h2>Reciba las mejores rutinas y recetas fitness</h2>
           
            <label for="fname">Nombre</label><br>
            <input type="text" placeholder="Active On Fitness"><br>
            <label for="mail">Email</label><br>
            <input type="mail" placeholder="activeOnFitness@gmail.com"><br>
            <button>Enviar</button>
        </form>
   </section>
   
   <footer id="contacto">
     <div class="links">
       <a href="">Contacto</a> 
       <a href="">Politicas y privacidad</a>
       <a href="">Redes sociales</a>
       <a href="">Ubicación</a> 
     </div>
    </footer>
</body>
</html>

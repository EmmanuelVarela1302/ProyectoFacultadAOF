<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Active On Fitness</title>
</head>
<body>
    <!-- Navbar Bootstrap -->
    <nav class="navbar navbar-expand-lg bg-warning">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="Recursos Proyecto Facu/logo.png" alt="logo" width="60" class="rounded-circle">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <button id="qs" class="btn btn-outline-dark m-1">Quienes Somos</button>
            </li>
            <li class="nav-item">
              <a href="#productos" class="btn btn-outline-dark m-1">Productos</a>
            </li>
            <li class="nav-item">
              <button id="not" class="btn btn-outline-dark m-1">Noticias</button>
            </li>
            <li class="nav-item">
              <a href="#contacto" class="btn btn-outline-dark m-1">Contacto</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <article class="presentacion">
        <img src="Recursos Proyecto Facu/banner.png" alt="banner">
    </article>

    <section id="productos" class="productos">
      <div class="container">
        <div class="tituloProductos">
            <h3>Productos Digitales</h3>
        </div>
        <div class="row justify-content-center">
          <div class="col-md-4 text-center">
             <img src="Recursos Proyecto Facu/abdominales.png" alt="Abdominales" class="img-fluid rounded shadow">
             <p>Rutinas para Abdominales</p>
          </div>
          <div class="col-md-4 text-center">
             <img src="Recursos Proyecto Facu/nutricion.png" alt="Nutrición" class="img-fluid rounded shadow">
             <p>Plan de Nutrición</p>
          </div>
          <div class="col-md-4 text-center">
             <img src="Recursos Proyecto Facu/running.png" alt="Running" class="img-fluid rounded shadow">
             <p>Entrenamiento Running</p>
          </div>
        </div>
      </div>
    </section>

    <section class="registro">
      <div class="container">
        <form class="formulario">
            <h2>Reciba las mejores rutinas y recetas fitness</h2>
            <div class="mb-3">
              <label for="fname" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="fname" placeholder="Active On Fitness">
            </div>
            <div class="mb-3">
              <label for="mail" class="form-label">Email</label>
              <input type="email" class="form-control" id="mail" placeholder="activeOnFitness@gmail.com">
            </div>
            <button class="btn btn-dark">Enviar</button>
        </form>
      </div>
    </section>

    <footer id="contacto">
      <div class="container">
        <div class="links d-flex justify-content-center gap-4 py-3">
          <a href="">Contacto</a> 
          <a href="">Políticas y privacidad</a>
          <a href="">Redes sociales</a>
          <a href="">Ubicación</a> 
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
